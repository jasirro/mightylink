name: MightyLink CI & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend API & Auth Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start API Server
        run: node server.js &
        env:
          PORT: 5000
          JWT_SECRET: ci-test-secret-key

      - name: Verify Health Endpoint
        run: |
          sleep 2
          curl --fail http://localhost:5000/health

      - name: Test User Registration
        run: |
          curl --fail -X POST http://localhost:5000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"citest@mightylink.io","password":"testpassword123","name":"CI Test"}'

      - name: Test User Login & Links Retrieval
        run: |
          TOKEN=$(curl -s -X POST http://localhost:5000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"citest@mightylink.io","password":"testpassword123"}' | jq -r '.token')
          
          echo "Token received: $TOKEN"
          curl --fail -X GET http://localhost:5000/api/links \
            -H "Authorization: Bearer $TOKEN"

  flutter-analyze:
    name: Flutter Code Quality & Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze
